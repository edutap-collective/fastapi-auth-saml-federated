name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xmlsec1
      # The runner's system Python is externally managed (PEP 668), so install into
      # ./.venv, which `uv pip` and the `uv run` calls in the Makefile pick up.
      # python-version also sets UV_PYTHON, overriding .python-version; with it,
      # setup-uv creates the venv itself, hence --allow-existing.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv --allow-existing
      - run: uv pip install -e ".[dev]"
      - run: make lint
      - run: make test-local
  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: fa }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xmlsec1
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --allow-existing
      - run: uv pip install -e ".[dev,postgres]"
      # Services come from the job definition above, so this calls pytest directly
      # instead of `make test-integration` (which starts its own compose stack).
      - run: uv run pytest -m integration
        env:
          IT_REDIS_URL: redis://localhost:6379/0
          IT_DB_URL: postgresql+asyncpg://postgres:pw@localhost:5432/fa
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fa-saml:ci .
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --allow-existing
      - run: uv pip install -e ".[docs]"
      - run: uv run sphinx-build -W -b html docs docs/_build
