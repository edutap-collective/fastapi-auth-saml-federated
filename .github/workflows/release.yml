# Publish to PyPI via Trusted Publishing (OIDC) when a version tag is pushed.
# One-time setup on PyPI and GitHub: docs/howto/release.md.
name: Release
on:
  push:
    tags: ["v*"]

# Two tags pushed in quick succession must not publish in parallel.
concurrency:
  group: release
  cancel-in-progress: false

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches project.version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match project.version ${version} (expected v${version})"
            exit 1
          fi
      - name: Check that the tagged commit is on main
        run: |
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "::error::Tagged commit ${GITHUB_SHA} is not on main"
            exit 1
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # No cache in a release build: nothing restored from other runs ends up in dist/.
          enable-cache: false
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The PyPI Trusted Publisher is bound to this environment name.
    environment:
      name: pypi
      url: https://pypi.org/project/fastapi-auth-saml-federated/
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
