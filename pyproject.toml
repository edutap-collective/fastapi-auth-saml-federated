[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-auth-saml-federated"
version = "0.1.0.dev0"
description = "Federated SAML2 Service Provider for FastAPI (Shibboleth/eduGAIN/NREN AAIs)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0 OR EUPL-1.2"
license-files = ["LICENSE-APACHE", "LICENSE-EUPL"]
authors = [{ name = "Alexander Loechel", email = "Alexander.Loechel@lmu.de" }]
keywords = ["saml", "saml2", "shibboleth", "edugain", "fastapi", "sso", "federation", "eduperson", "schac"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pysaml2>=7.5.4",
    "itsdangerous>=2.2",
    "anyio>=4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "jinja2>=3.1",
]

[project.optional-dependencies]
redis = ["redis>=5"]
postgres = ["sqlmodel>=0.0.22", "asyncpg>=0.29"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "anyio>=4",
    "respx>=0.21",
    "responses>=0.25",
    "httpx>=0.27",
    "ruff>=0.6",
    "ty",
    "pdbp>=1.5",
    "fakeredis>=2.20",
    "aiosqlite>=0.20",
    "redis>=5",
    "sqlmodel>=0.0.22",
]

[project.urls]
Repository = "https://github.com/loechel/fastapi-auth-saml-federated"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fastapi_auth*"]
namespaces = true

[tool.setuptools.package-data]
"fastapi_auth.saml.wayf" = ["templates/*.html"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "D", "S"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S108", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    "error",
    # Upstream Starlette/httpx transition: FastAPI's TestClient still imports httpx (0.x);
    # Starlette nudges toward httpx2. Not our code. Revisit when the ecosystem settles.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]
